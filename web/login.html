<!DOCTYPE html>
<html lang="en" data-i18n-title="doc.titleLogin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseline - Log in</title>
  <meta name="description" content="Log in to Baseline, the health record that notices.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <script>
    // Apply the saved theme before the page paints, so there's no flash.
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("baseline_theme") || "light"); } catch (e) {}
  </script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-top">
      <a href="index.html" class="brand-logo auth-brand" aria-label="Baseline Home" data-i18n-aria="common.home"><span>Baseline</span></a>
      <select class="app-select lang-switch" data-lang-switch data-i18n-aria="common.language" aria-label="Language">
        <option value="en">English</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>

    <div class="auth-mascot">
      <img class="mascot-avatar" src="mascot/wave.svg" alt="Cartoon doctor mascot" data-i18n-alt="common.mascotAlt">
      <p class="mascot-bubble" id="auth-greeting">Welcome back! Log in to see your family's lab history.</p>
    </div>

    <section class="card auth-card">
      <div class="auth-tabs" role="tablist" aria-label="Log in or create an account" data-i18n-aria="login.tabsAria">
        <button type="button" role="tab" id="tab-login" class="auth-tab active" aria-selected="true" data-i18n="login.login">Log in</button>
        <button type="button" role="tab" id="tab-register" class="auth-tab" aria-selected="false" data-i18n="login.register">Create account</button>
      </div>

      <form id="auth-form" class="auth-form" novalidate>
        <div id="username-row" hidden>
          <label for="auth-username" class="auth-label" data-i18n="login.username">Username</label>
          <input type="text" id="auth-username" class="date-input auth-input" autocomplete="nickname" maxlength="30" placeholder="What should we call you?" data-i18n-placeholder="login.usernamePh">
        </div>

        <div>
          <label for="auth-email" class="auth-label" data-i18n="login.email">Email</label>
          <input type="email" id="auth-email" class="date-input auth-input" autocomplete="email" required maxlength="254" placeholder="you@example.com">
        </div>

        <div>
          <label for="auth-password" class="auth-label" data-i18n="login.password">Password</label>
          <div class="password-field">
            <input type="password" id="auth-password" class="date-input auth-input" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="At least 8 characters" data-i18n-placeholder="login.passwordPh">
            <button type="button" class="reveal-btn" data-target="auth-password" aria-label="Show password" data-i18n-aria="login.show" aria-pressed="false">👁</button>
          </div>
        </div>

        <div id="confirm-row" hidden>
          <label for="auth-confirm" class="auth-label" data-i18n="login.confirm">Confirm password</label>
          <div class="password-field">
            <input type="password" id="auth-confirm" class="date-input auth-input" autocomplete="new-password" maxlength="128" placeholder="Type it again" data-i18n-placeholder="login.confirmPh">
            <button type="button" class="reveal-btn" data-target="auth-confirm" aria-label="Show password" data-i18n-aria="login.show" aria-pressed="false">👁</button>
          </div>
        </div>

        <div id="auth-notice" class="auth-notice" role="status"></div>
        <div id="auth-error" class="auth-error" role="alert"></div>

        <button type="submit" id="auth-submit" class="btn btn-primary auth-submit">Log in</button>
      </form>
    </section>

    <p class="auth-boundary" data-i18n="common.boundary">Baseline explains and tracks lab results. It does not diagnose or recommend treatment. Talk to a doctor about any result.</p>
  </main>

  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="mascot.js"></script>
  <script>
    Mascot.decorate(document.querySelector(".auth-mascot .mascot-avatar"), "wave");

    (() => {
      // Already logged in? Go straight to the app.
      if (Auth.token()) {
        window.location.replace("app.html");
        return;
      }

      let mode = "login";   // or "register"
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const confirmRow = document.getElementById("confirm-row");
      const usernameRow = document.getElementById("username-row");
      const username = document.getElementById("auth-username");
      const password = document.getElementById("auth-password");
      const confirm = document.getElementById("auth-confirm");
      const submit = document.getElementById("auth-submit");
      const errorBox = document.getElementById("auth-error");
      const notice = document.getElementById("auth-notice");
      const greeting = document.getElementById("auth-greeting");

      function setMode(next) {
        mode = next;
        const isRegister = mode === "register";
        tabLogin.classList.toggle("active", !isRegister);
        tabRegister.classList.toggle("active", isRegister);
        tabLogin.setAttribute("aria-selected", String(!isRegister));
        tabRegister.setAttribute("aria-selected", String(isRegister));
        confirmRow.hidden = !isRegister;
        usernameRow.hidden = !isRegister;
        password.autocomplete = isRegister ? "new-password" : "current-password";
        submit.textContent = t(isRegister ? "login.register" : "login.login");
        greeting.textContent = t(isRegister ? "login.welcomeNew" : "login.welcome");
        errorBox.textContent = "";
        notice.textContent = "";
      }

      // Show / hide password: switch the input between type "password" and "text".
      document.querySelectorAll(".reveal-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.dataset.target);
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.setAttribute("aria-pressed", String(show));
          btn.setAttribute("aria-label", t(show ? "login.hide" : "login.show"));
          btn.textContent = show ? "🙈" : "👁";
        });
      });

      // Language switched: redraw the text this script set itself (the rest is data-i18n).
      document.addEventListener("baseline:lang", () => {
        const notice = errorBox.textContent;
        setMode(mode);
        errorBox.textContent = notice;
        document.querySelectorAll(".reveal-btn").forEach((btn) => {
          btn.setAttribute("aria-label", t(btn.getAttribute("aria-pressed") === "true" ? "login.hide" : "login.show"));
        });
      });

      tabLogin.addEventListener("click", () => setMode("login"));
      setMode("login");
      tabRegister.addEventListener("click", () => setMode("register"));

      document.getElementById("auth-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.textContent = "";
        const email = document.getElementById("auth-email").value.trim();

        if (mode === "register" && password.value !== confirm.value) {
          errorBox.textContent = t("login.mismatch");
          return;
        }

        submit.disabled = true;
        submit.textContent = t(mode === "register" ? "login.creating" : "login.loggingIn");
        try {
          if (mode === "register") {
            // Account created: switch to the login tab so the person logs in themselves.
            const created = await API.register(email, password.value, username.value);
            setMode("login");
            document.getElementById("auth-email").value = created.email;
            password.value = "";
            confirm.value = "";
            notice.textContent = t("login.created", { name: created.username });
            submit.disabled = false;
            password.focus();
            return;
          }
          await API.login(email, password.value);
          window.location.replace("app.html");
        } catch (err) {
          errorBox.textContent = err.message;
          submit.disabled = false;
          submit.textContent = t(mode === "register" ? "login.register" : "login.login");
        }
      });
    })();
  </script>
</body>
</html>
