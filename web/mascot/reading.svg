<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Dr. Bindu reading report">
  <defs>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="scrubsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Body / Lab Coat -->
  <path d="M 28 116 C 28 85 40 76 60 76 C 80 76 92 85 92 116 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="50,76 70,76 60,94" fill="url(#scrubsGrad)"/>

  <!-- Stethoscope -->
  <path d="M 44 80 C 44 98 56 104 60 104 C 64 104 76 98 76 80" fill="none" stroke="#042f2e" stroke-width="3" stroke-linecap="round"/>

  <!-- Head tilted slightly down -->
  <ellipse cx="60" cy="50" rx="24" ry="25" fill="#fcd34d"/>
  
  <!-- Hair -->
  <path d="M 36 46 C 36 26 50 20 60 20 C 70 20 84 26 84 46 C 84 36 76 28 60 28 C 44 28 36 36 36 46 Z" fill="#1e293b"/>
  <ellipse cx="60" cy="18" rx="12" ry="7" fill="#1e293b"/>

  <!-- Glasses tilted down -->
  <circle cx="51" cy="52" r="7.5" fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="69" cy="52" r="7.5" fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <line x1="58.5" y1="52" x2="61.5" y2="52" stroke="#0d9488" stroke-width="2.5"/>

  <!-- Eyes looking downward at report -->
  <circle cx="51" cy="54" r="2.5" fill="#0f172a"/>
  <circle cx="69" cy="54" r="2.5" fill="#0f172a"/>

  <!-- Concentrating mouth (flat line) -->
  <line x1="56" y1="62" x2="64" y2="62" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Clipboard / Lab Report in hands -->
  <rect x="42" y="78" width="36" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <!-- Clip top -->
  <rect x="52" y="74" width="16" height="6" rx="2" fill="#0d9488"/>
  <!-- Lines on sheet -->
  <line x1="48" y1="86" x2="72" y2="86" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="92" x2="68" y2="92" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="98" x2="70" y2="98" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="104" x2="62" y2="104" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Hands holding clipboard -->
  <ellipse cx="42" cy="94" rx="5" ry="6" fill="#fcd34d"/>
  <ellipse cx="78" cy="94" rx="5" ry="6" fill="#fcd34d"/>
</svg>
